# Prometheus for the harness. Mounted read-only by compose.yml; rules come from
# ./rules, probe targets from the file the probe-targets init container writes.
# Nothing here names a host: the HTTPS targets are rendered from DOMAIN.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: harness

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: blackbox
    static_configs:
      - targets: ['blackbox-exporter:9115']

  # Every subdomain in PROBE_SUBDOMAINS, probed over HTTPS through the
  # blackbox exporter: probe_success for up/down, probe_ssl_earliest_cert_expiry
  # for the certificate.
  - job_name: probes
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
