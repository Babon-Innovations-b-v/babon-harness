# The media box: Nextcloud Talk calls through a signaling server, and
# server-side recording of those calls. Runs on its own server, never on the
# main one, and outside auto-deploy (see CLAUDE.md). This file is named
# docker-compose.yml, not compose.yml, so the deploy loop never picks it up.
#
#   caddy      HTTPS for signaling.$DOMAIN and recording.$DOMAIN
#   nats       message bus for the signaling server
#   janus      the media server (SFU), built from source; the path recording taps
#   signaling  Nextcloud Talk's High Performance Backend, image tagged by commit
#   recording  the Talk recording server, a headless browser, built from source
#
# Host networking throughout, as upstream's own compose does, so media UDP
# is direct. The firewall opens 22, 80, 443 and UDP 20000-40000; ports 8080,
# 8000, 8188 and 4222 listen on the box only.
#
# ./.env is written by deploy.sh from the vault and never committed. It holds
# DOMAIN, MEDIA_PUBLIC_IP and the TALK_* secrets; setup.sh renders them into
# signaling.conf and recording.conf. Build contexts are the pinned clones
# setup.sh places beside this file.

services:
  caddy:
    image: caddy:2.11.7
    network_mode: host
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  nats:
    image: nats:2.10
    network_mode: host
    restart: unless-stopped

  janus:
    build: ./nextcloud-spreed-signaling/docker/janus
    # --nat-1-1 advertises the box's public IP in ICE candidates, so a remote
    # browser reaches media directly without a TURN relay. The port range must
    # match the firewall's UDP rule in provision.sh.
    command: ["janus", "--full-trickle", "--nat-1-1=${MEDIA_PUBLIC_IP:?set MEDIA_PUBLIC_IP in .env}", "--rtp-port-range=20000-40000"]
    network_mode: host
    restart: unless-stopped

  signaling:
    # Published image tagged by commit (upstream has no semver tag for it);
    # matches SIG_COMMIT in setup.sh.
    image: strukturag/nextcloud-spreed-signaling:6046e47
    volumes:
      - ./signaling.conf:/config/server.conf:ro
    network_mode: host
    restart: unless-stopped
    depends_on: [nats, janus]

  recording:
    build:
      context: ./nextcloud-talk-recording
      dockerfile: ./docker-compose/Dockerfile
    init: true
    shm_size: "2gb"        # the headless browser needs shared memory
    volumes:
      - ./recording.conf:/etc/nextcloud-talk-recording/server.conf:ro
    network_mode: host
    restart: on-failure
    depends_on: [signaling]

volumes:
  caddy_data:
  caddy_config:
