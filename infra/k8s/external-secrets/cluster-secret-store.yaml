# The one bridge from the vault (Scaleway Secret Manager) into the cluster.
# Cluster-scoped, so each namespace below reads the vault through it instead
# of holding a key of its own. ${...} is filled from config/harness.env by
# infra/cluster/apply.sh.
#
# It authenticates with the IAM key in Secret external-secrets/vault-reader
# (keys access-key and secret-key), which infra/cluster/create-cluster.sh
# copies from ESO_ACCESS_KEY and ESO_SECRET_KEY in the vault. That key may only
# read secrets in SCW_PROJECT_ID.
#
# A `name:` ref resolves inside SCW_PROJECT_ID only; a secret in another
# project needs an `id:` ref.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  # Only these namespaces may read the vault. A new namespace that needs it
  # is added here in the same commit that creates it.
  conditions:
    - namespaces:
        - apps
        - deploy
        - monitoring
        - media
  provider:
    scaleway:
      region: ${SCW_REGION}
      projectId: ${SCW_PROJECT_ID}
      accessKey:
        secretRef:
          name: vault-reader
          namespace: external-secrets
          key: access-key
      secretKey:
        secretRef:
          name: vault-reader
          namespace: external-secrets
          key: secret-key
