# The vault split into one Secret key per setting: Secret harness-keys. A
# container names exactly the keys its compose service passed, each with
# secretKeyRef (optional: true), so it sees what it saw under compose and
# nothing more.
#
# The template reads the same KEY=value text as harness-env: a line that is
# not KEY=value is skipped, one pair of surrounding quotes is taken off, and an
# empty value is left out, so the app's own default applies. The defaults
# below are compose's `${KEY:-default}` values, kept in this one place; the
# vault wins whenever it holds a value. Checked against the External Secrets
# operator in a scratch namespace with a fake store (2026-11-04).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harness-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            {{- $vault := dict }}
            {{- range $line := splitList "\n" .vault }}
            {{- $line = trimSuffix "\r" $line }}
            {{- if regexMatch "^[A-Za-z_][A-Za-z0-9_]*=" $line }}
            {{- $pair := regexSplit "=" $line 2 }}
            {{- $_ := set $vault (index $pair 0) (regexReplaceAll "^\"(.*)\"$|^'(.*)'$" (index $pair 1) "${1}${2}") }}
            {{- end }}
            {{- end }}
            {{- range $key, $fallback := dict
                  "OPENCLAW_STATE_PATH" "/state/openclaw.db"
                  "OPENCLAW_DAILY_CAP_EUR" "5"
                  "ASSISTANT_NAME" "Assistant"
                  "ASSISTANT_TIMEZONE" "UTC"
                  "ASSISTANT_BRIEF_TIME" "08:00"
                  "ASSISTANT_ADVISOR_TIME" "09:00"
                  "ASSISTANT_AGENDA_WRITE" "0"
                  "ASSISTANT_GITHUB_WRITE" "0"
                  "ASSISTANT_MEETING_REMINDERS" "0"
                  "ASSISTANT_VOICE" "0"
                  "ASSISTANT_TEAM_MESSAGE" "1"
                  "ASSISTANT_VIDEO_CALL" "0"
                  "ASSISTANT_DOOR_WRITE" "1"
                  "ASSISTANT_QUIET_HOURS" "22:00-07:30"
                  "ASSISTANT_NAMESPACE" "default"
                  "SIGNAL_CLI_MODE" "json-rpc"
                  "NOTULEN_TARGET_PATH" "business/minutes"
                  "S3_REGION" "${SCW_REGION}"
                  "GPU_ENABLED" "0"
                  "GPU_NAMESPACE" "notulen"
                  "GPU_POOL" "notulen-gpu" }}
            {{- if not (get $vault $key) }}{{ $_ := set $vault $key $fallback }}{{ end }}
            {{- end }}
            {{- range $key, $value := $vault }}
            {{- if $value }}
            {{ $key }}: {{ $value | quote }}
            {{- end }}
            {{- end }}
  data:
    - secretKey: vault
      remoteRef:
        key: name:${VAULT_SECRET_NAME}
