# Secret registry-pull: the image pull secret for the stack's own images, from
# SCW_REGISTRY_PULL_KEY in the vault (an API key limited to registry read).
# The provider's registry takes any user name with the key as the password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: registry-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{- $key := "" }}
          {{- range $line := splitList "\n" .vault }}
          {{- $line = trimSuffix "\r" $line }}
          {{- if hasPrefix "SCW_REGISTRY_PULL_KEY=" $line }}{{ $key = trimPrefix "SCW_REGISTRY_PULL_KEY=" $line }}{{ end }}
          {{- end }}
          {{- dict "auths" (dict "${IMAGE_REGISTRY_HOST}" (dict "auth" (printf "nologin:%s" $key | b64enc))) | toJson }}
  data:
    - secretKey: vault
      remoteRef:
        key: name:${VAULT_SECRET_NAME}
