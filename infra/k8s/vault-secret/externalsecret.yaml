# The whole vault as one file: Secret harness-env, key harness.env, the same
# KEY=value text infra/secrets/pull-env.sh writes on a server. A pod mounts it
# as a file or reads single keys with secretKeyRef once a later piece splits
# them; no pod gets a key inline.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness-env
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harness-env
    creationPolicy: Owner
  data:
    - secretKey: harness.env
      remoteRef:
        key: name:${VAULT_SECRET_NAME}
