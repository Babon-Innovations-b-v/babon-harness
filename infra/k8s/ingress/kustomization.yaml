# The edge: Caddy behind the cloud load balancer, oauth2-proxy beside it.
# ./Caddyfile is rendered by infra/cluster/apply.sh from infra/caddy/Caddyfile
# (python3 -m infra.caddy.cluster_caddyfile) and git-ignored. No name hash on
# the ConfigMap, so Caddy's --watch reloads it in place instead of a roll.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingress
resources:
  - namespace.yaml
  - caddy.yaml
  - oauth2-proxy.yaml
components:
  - ../vault-secret
  - ../system-pool
configMapGenerator:
  - name: caddyfile
    files:
      - Caddyfile
    options:
      disableNameSuffixHash: true
