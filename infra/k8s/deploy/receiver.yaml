# The push receiver. Caddy routes deploy.<DOMAIN>/hooks/* here
# (infra/caddy/cluster_caddyfile); it checks the HMAC signature against
# DEPLOY_WEBHOOK_SECRET and a push to main, then starts the cycle and the lane
# at once (infra/deploy_loop/_receiver.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-webhook
  labels:
    app.kubernetes.io/name: deploy-webhook
    app.kubernetes.io/part-of: deploy-loop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deploy-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deploy-webhook
    spec:
      serviceAccountName: deploy-webhook
      priorityClassName: deploy-loop
      nodeSelector:
        ${POOL_ROLE_LABEL}: system
      tolerations:
        - key: ${POOL_ROLE_LABEL}
          operator: Equal
          value: system
          effect: NoSchedule
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: receiver
          image: ${DEPLOY_CYCLE_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "infra.deploy_loop", "receive"]
          env:
            - name: PORT
              value: "9000"
            - name: DEPLOY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEPLOY_RECEIVER_CRONJOBS
              value: deploy-cycle,commit-gate
            - name: DEPLOY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: harness-keys
                  key: DEPLOY_WEBHOOK_SECRET
                  optional: true
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deploy-webhook
  labels:
    app.kubernetes.io/name: deploy-webhook
spec:
  selector:
    app.kubernetes.io/name: deploy-webhook
  ports:
    - name: http
      port: 9000
      targetPort: 9000
