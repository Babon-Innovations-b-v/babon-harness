# The two Secrets only the deploy loop reads, both from the vault.
#
# registry-push: the docker config buildctl pushes the stack's images with,
# from SCW_REGISTRY_PUSH_KEY (an API key allowed to write the registry
# namespace). The pull secret registry-pull (../vault-secret) is read-only.
#
# deploy-git-read: `token` from DEPLOY_GIT_READ_TOKEN, a read-only token for a
# private repository. Mounted (optional) into the cycle's clone and every gate
# Job's fetch container only; a public repository leaves it empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-push
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: registry-push
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{- $key := "" }}
          {{- range $line := splitList "\n" .vault }}
          {{- $line = trimSuffix "\r" $line }}
          {{- if hasPrefix "SCW_REGISTRY_PUSH_KEY=" $line }}{{ $key = trimPrefix "SCW_REGISTRY_PUSH_KEY=" $line }}{{ end }}
          {{- end }}
          {{- dict "auths" (dict "${IMAGE_REGISTRY_HOST}" (dict "auth" (printf "nologin:%s" $key | b64enc))) | toJson }}
  data:
    - secretKey: vault
      remoteRef:
        key: name:${VAULT_SECRET_NAME}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deploy-git-read
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: deploy-git-read
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: |-
          {{- $token := "" }}
          {{- range $line := splitList "\n" .vault }}
          {{- $line = trimSuffix "\r" $line }}
          {{- if hasPrefix "DEPLOY_GIT_READ_TOKEN=" $line }}{{ $token = trimPrefix "DEPLOY_GIT_READ_TOKEN=" $line }}{{ end }}
          {{- end }}
          {{- $token }}
  data:
    - secretKey: vault
      remoteRef:
        key: name:${VAULT_SECRET_NAME}
