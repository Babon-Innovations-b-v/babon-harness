# Prometheus, one replica. Its config and rules are generated ConfigMaps
# (kustomization.yaml), so a changed rule renames the ConfigMap and rolls the
# pod; nothing has to call /-/reload. The probe targets are written at start
# by an init container running infra/observability/probes/render_targets.py
# from DOMAIN and PROBE_SUBDOMAINS, the same script compose runs.
#
# The claim is a starting size, not measured, and starts empty: the server's
# history is not carried over. It holds history, not state, so it carries no
# backup label.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Read-only and namespaced: the node job's endpointslice discovery reads the
# slices, Services and Pods in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [services, pods, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
      initContainers:
        # FAILURE POLICY (the script's): no DOMAIN exits 1, so Prometheus
        # never starts with an empty target list pretending all is well.
        - name: probe-targets
          image: python:3.12-slim
          command: ["python", "/script/render_targets.py"]
          env:
            - name: PROBE_TARGETS_FILE
              value: /targets/probes.json
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DOMAIN
              valueFrom:
                secretKeyRef: {name: harness-keys, key: DOMAIN}
            - name: PROBE_SUBDOMAINS
              valueFrom:
                secretKeyRef: {name: harness-keys, key: PROBE_SUBDOMAINS, optional: true}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: targets
              mountPath: /targets
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.1
          args:
            - --config.file=/etc/prometheus/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: targets
              mountPath: /etc/prometheus/targets
              readOnly: true
            - name: data
              mountPath: /prometheus
              subPath: prometheus-data
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: script
          configMap:
            name: probe-targets-script
        - name: targets
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
# Reached by the door as prometheus.monitoring.svc.cluster.local:9090.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
