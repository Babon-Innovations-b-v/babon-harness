# The public website (apps/website/compose.yml): static files behind nginx,
# no state and no secret. Two replicas, so a roll never leaves the bare domain
# without a server. The tag is a placeholder the deploy loop replaces by
# digest with `kubectl set image`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  labels:
    app: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      imagePullSecrets:
        - name: registry-pull
      containers:
        - name: website
          image: ${IMAGE_REGISTRY}/website:set-by-deploy-loop
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: website
spec:
  selector:
    app: website
  ports:
    - name: http
      port: 80
      targetPort: http
