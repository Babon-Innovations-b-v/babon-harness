---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: assistant-claim-audit
  labels:
    app: assistant-claim-audit
spec:
  schedule: "30 8 * * 1"
  timeZone: ${ASSISTANT_TIMEZONE}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Never re-run: a trigger POSTed twice runs its pass twice. The failed
      # Job is the record of the miss, and kube-state-metrics counts it.
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: assistant-claim-audit
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: registry-pull
          containers:
            - name: watch
              image: ${IMAGE_REGISTRY}/assistant:set-by-deploy-loop
              command: ["python", "-m", "apps.assistant.watch", "claim-audit"]
              envFrom:
                - configMapRef:
                    name: assistant-watch-env
                - secretRef:
                    name: harness-keys
                    optional: true
              env:
                - name: OPENCLAW_CLAIM_AUDIT_TEXTFILE_DIR
                  value: /textfile
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: textfile
                  mountPath: /textfile
          volumes:
            - name: textfile
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: assistant-chat-relay
  labels:
    app: assistant-chat-relay
spec:
  schedule: "*/2 * * * *"
  timeZone: ${ASSISTANT_TIMEZONE}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Never re-run: a trigger POSTed twice runs its pass twice. The failed
      # Job is the record of the miss, and kube-state-metrics counts it.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: assistant-chat-relay
        spec:
          serviceAccountName: assistant-chat-relay
          restartPolicy: Never
          imagePullSecrets:
            - name: registry-pull
          containers:
            - name: watch
              image: ${IMAGE_REGISTRY}/assistant:set-by-deploy-loop
              command: ["python", "-m", "apps.assistant.watch", "chat-relay"]
              envFrom:
                - configMapRef:
                    name: assistant-watch-env
                - secretRef:
                    name: harness-keys
                    optional: true
              env:
                - name: ASSISTANT_GATEWAY_EXEC
                  value: kubectl -n assistant-gateway exec deploy/gateway -c gateway --
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: state
                  mountPath: /var/lib/harness
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: assistant-watch-state
